<text x="500" y="717" class="small">No extra ordinary coverage-soft weights; LME and image salience remain.</text>
<text x="50" y="778" class="small">Original mass-preserving Geometry and patch-only strength routes have different invariants. VIP observer/salience and the quadratic solve are attributed.</text>
<text x="50" y="802" class="small">Frozen exploratory release · 2026-10-09 · Full results, vocabulary budget, timing scope and failure cases are documented separately.</text>
