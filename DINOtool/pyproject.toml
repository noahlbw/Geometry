[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dino-remote-ovss"
version = "0.1.0"
description = "DINOv3 open-vocabulary segmentation and external-data adaptation for remote sensing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ftfy>=6.0",
  "numpy>=1.26",
  "omegaconf>=2.3",
  "Pillow>=10.0",
  "rasterio>=1.3.10",
  "regex>=2024.0",
  "scikit-learn>=1.4",
  "submitit>=1.5",
  "termcolor>=2.0",
  "torch>=2.6",
  "torchmetrics>=1.4",
  "torchvision>=0.21",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
dino-ovss = "dinotool.cli:main"
dino-ovss-agent = "dinotool.agent_tool:main"

[tool.setuptools.packages.find]
include = ["dinotool*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
